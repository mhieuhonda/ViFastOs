# ViFastOs Desktop: cùng kernel, 2 hart, có IOMMU.
# init và pager được cấp untyped nên tạo được tiến trình và cấp bộ nhớ lúc chạy.
profile = "desktop"
memory = 4194304
harts = 2
iommu = true

[[devices]]
name = "camera"
kind = "dma_sensor"
mmio = 0x10000000
irq = 7

[objects]
console_ep = "endpoint"
pager_ep = "endpoint"
cam_ntfn = "notification"
dmabuf = "frame"

[[tasks]]
name = "console"
image = "console"
priority = 100
caps = [
  { name = "console_ep", slot = 1, obj = "console_ep", rights = "R" },
]

[[tasks]]
name = "init"
image = "init"
priority = 90
mcp = 100
caps = [
  { name = "console", slot = 1, obj = "console_ep", rights = "WG" },
  { name = "mem", slot = 2, untyped_bits = 16 },
  { name = "irq_control", slot = 3, irq_control = true },
  { name = "sched_control", slot = 4, sched_control = true },
]

[[tasks]]
name = "pager"
image = "pager"
priority = 120
core = 1
caps = [
  { name = "pager_ep", slot = 1, obj = "pager_ep", rights = "R" },
  { name = "mem", slot = 2, untyped_bits = 16 },
  { name = "lazy_vs", slot = 3, vspace = "lazy" },
]

[[tasks]]
name = "lazy"
image = "lazy"
priority = 60
core = 1
fault = { obj = "pager_ep", badge = 1 }

[[tasks]]
name = "cam_driver"
image = "cam_driver"
priority = 110
core = 1
caps = [
  { name = "cam_regs", slot = 1, device = "camera", rights = "RW", map = 0x50000000 },
  { name = "cam_io", slot = 2, iospace = "camera" },
  { name = "cam_irq", slot = 3, irq = 7, notification = "cam_ntfn" },
  { name = "cam_ntfn", slot = 4, obj = "cam_ntfn", rights = "R" },
  { name = "dmabuf", slot = 5, obj = "dmabuf", rights = "RW", map = 0x200000 },
]
