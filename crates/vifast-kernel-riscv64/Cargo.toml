[package]
name = "vifast-kernel-riscv64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["test-exit"]
test-exit = ["vifast-runtime/test-exit"]
test-panic-hart1 = ["vifast-runtime/test-panic-hart1"]
test-boot-handoff = []
test-skip-tlb-ipi = ["vifast-runtime/test-skip-tlb-ipi", "vifast-platform-riscv64/test-skip-tlb-ipi"]

[dependencies]
vifast-abi = { path = "../vifast-abi" }
vifast-arch = { path = "../vifast-arch" }
vifast-platform-riscv64 = { path = "../vifast-platform-riscv64" }
vifast-kernel = { path = "../vifast-kernel" }
vifast-runtime = { path = "../vifast-runtime" }
