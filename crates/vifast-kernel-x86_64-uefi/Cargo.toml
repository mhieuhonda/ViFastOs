[package]
name = "vifast-kernel-x86_64-uefi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-destroy-smp = []
default = ["test-exit"]
test-exit = ["vifast-runtime/test-exit"]
test-panic-hart1 = ["vifast-runtime/test-panic-hart1"]
# r259 (T21/D19): bản biến thể kiểm bất biến sched ở ranh giới user.
check-boundary = ["vifast-runtime/check-boundary"]
# D18: bản biến thể cố ý làm hỏng bất biến (phải in BOUNDARY BAD).
check-boundary-mutation = ["vifast-runtime/check-boundary-mutation"]
test-ap-stall = ["vifast-platform-x86_64/test-ap-stall"]
test-skip-tlb-ipi = ["vifast-runtime/test-skip-tlb-ipi", "vifast-platform-x86_64/test-skip-tlb-ipi"]

[dependencies]
vifast-abi = { path = "../vifast-abi" }
vifast-arch = { path = "../vifast-arch" }
vifast-platform-x86_64 = { path = "../vifast-platform-x86_64" }
vifast-runtime = { path = "../vifast-runtime" }
vifast-kernel = { path = "../vifast-kernel" }
