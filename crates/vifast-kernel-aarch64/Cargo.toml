[package]
name = "vifast-kernel-aarch64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-destroy-smp = []
default = ["test-exit"]
test-exit = ["vifast-runtime/test-exit"]
test-panic-hart1 = ["vifast-runtime/test-panic-hart1"]
test-shell-linger = ["vifast-runtime/test-shell-linger"]

[dependencies]
vifast-abi = { path = "../vifast-abi" }
vifast-arch = { path = "../vifast-arch" }
vifast-platform-aarch64 = { path = "../vifast-platform-aarch64" }
vifast-kernel = { path = "../vifast-kernel" }
vifast-runtime = { path = "../vifast-runtime" }
