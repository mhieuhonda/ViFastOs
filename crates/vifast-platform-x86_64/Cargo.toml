[package]
name = "vifast-platform-x86_64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-ap-stall = []
test-skip-tlb-ipi = []
# r293/294.1: đèn chẩn đoán flake scheduler. MẶC ĐỊNH TẮT — bản phát hành
# không được chứa marker `BKL STUCK`.
diag-stall = []
# 294.B (r294): đèn T33a (`TICK n` mỗi 16 tick, `PIC STALL isr/imr`). TẮT mặc định.
diag-tick = []
# Khối A: vòng đệm sự kiện lập lịch, đổ ra khi watchdog bắn.
diag-sched = ["vifast-runtime/diag-sched"]

[dependencies]
vifast-abi = { path = "../vifast-abi" }
vifast-pte = { path = "../vifast-pte" }
vifast-maint = { path = "../vifast-maint" }
vifast-arch = { path = "../vifast-arch" }
vifast-arch-x86_64 = { path = "../vifast-arch-x86_64" }
vifast-kernel = { path = "../vifast-kernel" }
vifast-runtime = { path = "../vifast-runtime" }
vifast-acpi = { path = "../vifast-acpi" }
