[package]
name = "vifast-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Test harness may terminate QEMU after TIMER_TICKS and print PREEMPT OK.
# Production/user builds should leave this disabled.
test-exit = []
test-panic-hart1 = []
test-skip-tlb-ipi = []
# r254 (T17): giữ guest sống lâu hơn để `--interactive` kịp gõ kịch bản shell.
# CHỈ dùng cho bản kernel biến thể của test tương tác; gate/soak không dùng.
test-shell-linger = []
# r259 (T21/D19): kiểm bất biến sched ở ranh giới trả về user.
check-boundary = ["vifast-kernel/check-boundary"]
# D18: biến thể cố ý làm hỏng bất biến để chứng minh phép kiểm bắt được.
check-boundary-mutation = ["check-boundary", "vifast-kernel/check-boundary-mutation"]

[dependencies]
vifast-abi = { path = "../vifast-abi" }
vifast-arch = { path = "../vifast-arch" }
vifast-kernel = { path = "../vifast-kernel" }
vifast-elf = { path = "../vifast-elf" }
