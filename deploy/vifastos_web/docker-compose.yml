# Production compose for os.vifast.org (ViFastOs early-access site).
# Container joins the external `coolify` network so the Coolify Traefik
# instance on the same host discovers it via docker labels.
#
#   mkdir -p data && chown -R 10001:10001 data    # bind mount must be writable
#   cp .env.example .env                          # set ADMIN_PASSWORD, STATS_SALT
#   docker compose up -d --build
#
# TLS: Let's Encrypt via Traefik (certresolver `letsencrypt`).

services:
  web:
    build: .
    image: vifastos-web:latest
    container_name: vifastos-web
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-https://os.vifast.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-os.vifast.org,localhost,127.0.0.1}
      STATS_SALT: ${STATS_SALT:-change-me-in-production}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.middlewares.vifastos-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.vifastos-compress.compress=true"
      - "traefik.http.routers.vifastos-http.rule=Host(`os.vifast.org`)"
      - "traefik.http.routers.vifastos-http.entrypoints=http"
      - "traefik.http.routers.vifastos-http.middlewares=vifastos-redirect"
      - "traefik.http.routers.vifastos-http.service=vifastos"
      - "traefik.http.routers.vifastos-https.rule=Host(`os.vifast.org`)"
      - "traefik.http.routers.vifastos-https.entrypoints=https"
      - "traefik.http.routers.vifastos-https.middlewares=vifastos-compress"
      - "traefik.http.routers.vifastos-https.tls=true"
      - "traefik.http.routers.vifastos-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vifastos-https.service=vifastos"
      - "traefik.http.services.vifastos.loadbalancer.server.port=8000"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  coolify:
    external: true
